<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>更新 - 薔薇が好き</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header" aria-label="サイトヘッダー">
      <a class="brand" href="index.html" aria-label="薔薇が好き ホーム">
        <span class="brand-mark" aria-hidden="true">R</span>
        <span>
          <strong>薔薇が好き</strong>
          <small>update room</small>
        </span>
      </a>

      <nav class="top-nav" aria-label="メインメニュー">
        <a href="index.html#logs">Logs</a>
        <a href="index.html#profile">Profile</a>
      </nav>
    </header>

    <main>
      <section class="admin-hero" aria-labelledby="admin-title">
        <p class="eyebrow">Owner update</p>
        <h1 id="admin-title">活動ログを追加</h1>
        <p>
          ここで記事とプロフィールのデータを作れます。作成したファイルをGitHubにアップロードすると、公開サイトに反映されます。
        </p>
      </section>

      <section class="composer-section" aria-labelledby="new-post-title">
        <div class="section-heading">
          <p class="eyebrow">New post</p>
          <h2 id="new-post-title">新しい投稿</h2>
        </div>

        <form class="composer" id="admin-form" action="#" method="post" autocomplete="off">
          <label>
            <span>タイトル</span>
            <input
              id="admin-title-input"
              name="title"
              type="text"
              maxlength="48"
              placeholder="例：雨の日に見つけた白い薔薇"
              required
            />
          </label>

          <label>
            <span>カテゴリ</span>
            <select id="admin-category" name="category">
              <option>Daily</option>
              <option>Rose</option>
              <option>Study</option>
              <option>Walk</option>
              <option>Cafe</option>
              <option>Mood</option>
            </select>
          </label>

          <label>
            <span>日付</span>
            <input id="admin-date" name="date" type="date" required />
          </label>

          <label class="wide">
            <span>写真ファイル名・URL</span>
            <input
              id="admin-image"
              name="image"
              type="text"
              placeholder="例：rose.jpg / images/rose.jpg / https://..."
            />
          </label>

          <label class="wide">
            <span>本文</span>
            <textarea
              id="admin-body"
              name="body"
              rows="6"
              maxlength="420"
              placeholder="今日やったこと、感じたこと、残しておきたい一文など。"
              required
            ></textarea>
          </label>

          <button class="button button-primary wide" type="submit">
            posts.jsonを作成
          </button>
        </form>

        <div class="download-panel" id="download-panel" hidden>
          <p id="download-status"></p>
          <a class="button button-primary" id="download-link" href="#" download="posts.json">
            posts.jsonをダウンロード
          </a>
        </div>
      </section>

      <section class="composer-section" aria-labelledby="profile-edit-title">
        <div class="section-heading">
          <p class="eyebrow">Profile</p>
          <h2 id="profile-edit-title">プロフィール更新</h2>
        </div>

        <form class="composer profile-editor" id="profile-form" action="#" method="post" autocomplete="off">
          <label>
            <span>見出し</span>
            <input
              id="profile-title-input"
              name="title"
              type="text"
              maxlength="48"
              placeholder="例：About me"
              required
            />
          </label>

          <label>
            <span>更新日・頻度</span>
            <input
              id="profile-updated-input"
              name="updated"
              type="text"
              maxlength="48"
              placeholder="例：気が向いた日"
            />
          </label>

          <label class="wide">
            <span>紹介文</span>
            <textarea
              id="profile-copy-input"
              name="copy"
              rows="5"
              maxlength="360"
              placeholder="自分のこと、このサイトのこと、好きなものなど。"
              required
            ></textarea>
          </label>

          <label>
            <span>テーマ</span>
            <input
              id="profile-theme-input"
              name="theme"
              type="text"
              maxlength="80"
              placeholder="例：Rose / Monochrome / Diary"
            />
          </label>

          <label>
            <span>リンク</span>
            <input
              id="profile-links-input"
              name="links"
              type="text"
              maxlength="120"
              placeholder="例：Instagram / X / YouTube"
            />
          </label>

          <button class="button button-primary wide" type="submit">
            profile.jsonを作成
          </button>
        </form>

        <div class="download-panel" id="profile-download-panel" hidden>
          <p id="profile-download-status"></p>
          <a class="button button-primary" id="profile-download-link" href="#" download="profile.json">
            profile.jsonをダウンロード
          </a>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>薔薇が好き</p>
      <a href="index.html">Back to site</a>
    </footer>

    <script src="admin.js"></script>
  </body>
</html>
