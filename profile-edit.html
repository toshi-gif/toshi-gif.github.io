<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>プロフィール更新 - 薔薇が好き</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header" aria-label="サイトヘッダー">
      <a class="brand" href="owner.html" aria-label="更新メニュー">
        <span class="brand-mark" aria-hidden="true">R</span>
        <span>
          <strong>薔薇が好き</strong>
          <small>profile edit</small>
        </span>
      </a>

      <nav class="top-nav" aria-label="メインメニュー">
        <a href="owner.html">Owner</a>
        <a href="post.html">Post</a>
        <a href="index.html#profile">Site</a>
      </nav>
    </header>

    <main>
      <section class="admin-hero" aria-labelledby="profile-edit-title">
        <p class="eyebrow">Profile</p>
        <h1 id="profile-edit-title">プロフィール更新</h1>
        <p>紹介文、テーマ、リンク表示を変えられます。</p>
      </section>

      <section class="composer-section" aria-labelledby="profile-form-title">
        <div class="section-heading">
          <p class="eyebrow">Edit profile</p>
          <h2 id="profile-form-title">プロフィール内容</h2>
        </div>

        <form class="composer profile-editor" id="profile-form" action="#" method="post" autocomplete="off">
          <label>
            <span>見出し</span>
            <input
              id="profile-title-input"
              name="title"
              type="text"
              maxlength="48"
              placeholder="例：About me"
              required
            />
          </label>

          <label>
            <span>更新日・頻度</span>
            <input
              id="profile-updated-input"
              name="updated"
              type="text"
              maxlength="48"
              placeholder="例：気が向いた日"
            />
          </label>

          <label class="wide">
            <span>紹介文</span>
            <textarea
              id="profile-copy-input"
              name="copy"
              rows="5"
              maxlength="360"
              placeholder="自分のこと、このサイトのこと、好きなものなど。"
              required
            ></textarea>
          </label>

          <label class="wide">
            <span>プロフィール写真</span>
            <input id="profile-image-input" name="image" type="file" accept="image/*" />
          </label>

          <div class="upload-preview wide" id="profile-image-preview" hidden>
            <img id="profile-image-preview-img" alt="選択したプロフィール写真のプレビュー" />
          </div>

          <label>
            <span>テーマ</span>
            <input
              id="profile-theme-input"
              name="theme"
              type="text"
              maxlength="80"
              placeholder="例：Rose / Monochrome / Diary"
            />
          </label>

          <label>
            <span>リンク</span>
            <input
              id="profile-links-input"
              name="links"
              type="text"
              maxlength="120"
              placeholder="例：Instagram / X / YouTube"
            />
          </label>

          <button class="button button-primary wide" type="submit">
            profile.jsonを作成
          </button>
        </form>

        <div class="download-panel" id="profile-download-panel" hidden>
          <p id="profile-download-status"></p>
          <a class="button button-primary" id="profile-download-link" href="#" download="profile.json">
            profile.jsonをダウンロード
          </a>
        </div>

        <div class="note-panel">
          <p>ダウンロードした `profile.json` をGitHubにアップロードして上書きすると、公開サイトに反映されます。</p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>薔薇が好き</p>
      <a href="owner.html">Back to owner</a>
    </footer>

    <script src="profile-edit.js"></script>
  </body>
</html>
